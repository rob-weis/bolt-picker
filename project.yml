name: BoltPicker

options:
  bundleIdPrefix: com.boltsandstars
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BoltPicker:
    type: application
    platform: macOS
    sources:
      - path: BoltPicker
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: BoltPicker/Info.plist
      properties:
        CFBundleName: Bolt Picker
        CFBundleDisplayName: Bolt Picker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: "© 2026 Bolts & Stars"
    entitlements:
      path: BoltPicker/BoltPicker.entitlements
      properties:
        # The only entitlement: a fully sandboxed app with no network,
        # file, camera, microphone or other access.
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: Bolt Picker
        PRODUCT_MODULE_NAME: BoltPicker
        PRODUCT_BUNDLE_IDENTIFIER: com.boltsandstars.BoltPicker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          # Don't let debuggers attach to the installed app.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  BoltPickerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BoltPickerTests
    dependencies:
      - target: BoltPicker
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boltsandstars.BoltPickerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bolt Picker.app/Contents/MacOS/Bolt Picker"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  BoltPicker:
    build:
      targets:
        BoltPicker: all
        BoltPickerTests: [test]
    test:
      config: Debug
      targets:
        - BoltPickerTests
    run:
      config: Debug
    archive:
      config: Release
